name: Build Fish Tracker V4

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Fish Tracker Motion V4
        shell: bash
        run: |
          test -f FishTrackerMotionV4_Source.zip
          rm -rf app
          unzip -oq FishTrackerMotionV4_Source.zip -x '.github/workflows/*' 'tests/*'
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Compile debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FishTrackerMotionV4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
