package com.fishtracker.motion

import android.app.*
import android.content.Context
import android.content.Intent
import android.graphics.*
import android.hardware.display.DisplayManager
import android.hardware.display.VirtualDisplay
import android.media.ImageReader
import android.media.projection.MediaProjection
import android.media.projection.MediaProjectionManager
import android.os.Handler
import android.os.IBinder
import android.os.Looper
import android.view.Gravity
import android.view.WindowManager
import android.widget.Button
import android.widget.LinearLayout
import android.widget.TextView

class AutoFishService : Service() {

    private lateinit var windowManager: WindowManager
    private lateinit var controlLayout: LinearLayout
    private lateinit var statusTextView: TextView

    private var mediaProjection: MediaProjection? = null
    private var virtualDisplay: VirtualDisplay? = null
    private var imageReader: ImageReader? = null

    private var isAutoRunning = false
    private val handler = Handler(Looper.getMainLooper())

    override fun onBind(intent: Intent?): IBinder? = null

    override fun onCreate() {
        super.onCreate()
        startForegroundNotification()
        windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
        setupFloatingControls()
    }

    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
        val resultCode = intent?.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
        val data: Intent? = intent?.getParcelableExtra("DATA")

        if (resultCode == Activity.RESULT_OK && data != null) {
            val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
            mediaProjection = mpManager.getMediaProjection(resultCode, data)
            setupScreenCapture()
        }
        return START_NOT_STICKY
    }

    private fun setupFloatingControls() {
        controlLayout = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(Color.argb(220, 20, 20, 20))
            setPadding(20, 16, 20, 16)
        }

        statusTextView = TextView(this).apply {
            text = "Trạng thái: Đang chờ bật Auto"
            setTextColor(Color.YELLOW)
            textSize = 14f
        }

        val btnRow = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
        }

        val btnToggleAuto = Button(this).apply { text = "Bật Auto" }
        val btnClose = Button(this).apply { text = "Thoát" }

        btnToggleAuto.setOnClickListener {
            isAutoRunning = !isAutoRunning
            btnToggleAuto.text = if (isAutoRunning) "Tắt Auto" else "Bật Auto"
            statusTextView.text = if (isAutoRunning) "Trạng thái: Đang tự động câu..." else "Trạng thái: Đã dừng"
        }

        btnClose.setOnClickListener {
            stopSelf()
        }

        btnRow.addView(btnToggleAuto)
        btnRow.addView(btnClose)

        controlLayout.addView(statusTextView)
        controlLayout.addView(btnRow)

        val params = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
            y = 40
        }

        windowManager.addView(controlLayout, params)
    }

    private fun setupScreenCapture() {
        val metrics = resources.displayMetrics
        imageReader = ImageReader.newInstance(metrics.widthPixels, metrics.heightPixels, PixelFormat.RGBA_8888, 2)
        virtualDisplay = mediaProjection?.createVirtualDisplay(
            "AutoFishV6Display",
            metrics.widthPixels, metrics.heightPixels, metrics.densityDpi,
            DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
            imageReader?.surface, null, null
        )

        imageReader?.setOnImageAvailableListener({ reader ->
            val image = reader.acquireLatestImage() ?: return@setOnImageAvailableListener
            if (isAutoRunning) {
                scanAndFish(image)
            }
            image.close()
        }, handler)
    }

    private fun scanAndFish(image: android.media.Image) {
        val planes = image.planes
        val buffer = planes[0].buffer
        val pixelStride = planes[0].pixelStride
        val rowStride = planes[0].rowStride

        val width = image.width
        val height = image.height

        // Quét vùng giữa màn hình (nơi xuất hiện thanh vòng cung câu cá)
        val startX = width / 4
        val endX = (width * 3) / 4
        val startY = height / 3
        val endY = (height * 3) / 4

        var fishDetected = false

        for (y in startY until endY step 4) {
            for (x in startX until endX step 4) {
                val offset = y * rowStride + x * pixelStride
                val r = buffer.get(offset).toInt() and 0xFF
                val g = buffer.get(offset + 1).toInt() and 0xFF
                val b = buffer.get(offset + 2).toInt() and 0xFF

                // Nhận diện phần đầu/thân icon con cá (màu sáng/trắng nổi bật)
                if (r > 200 && g > 200 && b > 200) {
                    fishDetected = true
                    break
                }
            }
            if (fishDetected) break
        }

        // Cập nhật trạng thái hiển thị trực quan lên giao diện nổi
        handler.post {
            if (fishDetected) {
                statusTextView.text = "Trạng thái: Thấy cá! -> Đang giữ dây"
                statusTextView.setTextColor(Color.GREEN)
            } else {
                statusTextView.text = "Trạng thái: Tìm cá..."
                statusTextView.setTextColor(Color.YELLOW)
            }
        }
    }

    private fun startForegroundNotification() {
        val channelId = "autofish_v6_channel"
        val channel = NotificationChannel(channelId, "Auto Fish Service V6", NotificationManager.IMPORTANCE_LOW)
        getSystemService(NotificationManager::class.java).createNotificationChannel(channel)

        val notification = Notification.Builder(this, channelId)
            .setContentTitle("Trợ lý câu cá V6")
            .setContentText("Hệ thống giám sát màn hình đang chạy...")
            .setSmallIcon(android.R.drawable.ic_menu_slideshow)
            .build()

        startForeground(1006, notification)
    }

    override fun onDestroy() {
        super.onDestroy()
        virtualDisplay?.release()
        mediaProjection?.stop()
        if (::controlLayout.isInitialized) windowManager.removeView(controlLayout)
    }
}
